<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesleki İngilizce Çalışma Yaprakları</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        h1 {
            margin-bottom: 25px;
            color: #1e293b;
            text-align: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .card-footer {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>
<body>

    <h1>Mesleki İngilizce Ders Notları ve Cevapları</h1>

    <div class="container">
        <div class="card">
            <img src="mesleki ingilize soruları_page-0001.jpg" alt="Mesleki İngilizce Sayfa 1">
            <div class="card-footer">Sayfa 1</div>
        </div>

        <div class="card">
            <img src="mesleki ingilize soruları_page-0002.jpg" alt="Mesleki İngilizce Sayfa 2">
            <div class="card-footer">Sayfa 2</div>
        </div>

        <div class="card">
            <img src="mesleki ingilize soruları_page-0003.jpg" alt="Mesleki İngilizce Sayfa 3">
            <div class="card-footer">Sayfa 3</div>
        </div>

        <div class="card">
            <img src="mesleki ingilize soruları_page-0004.jpg" alt="Mesleki İngilizce Sayfa 4">
            <div class="card-footer">Sayfa 4</div>
        </div>

        <div class="card">
            <img src="mesleki ingilize soruları_page-0005.jpg" alt="Mesleki İngilizce Sayfa 5">
            <div class="card-footer">Sayfa 5</div>
        </div>

        <div class="card">
            <img src="mesleki ingilize soruları_page-0006.jpg" alt="Mesleki İngilizce Sayfa 6">
            <div class="card-footer">Sayfa 6</div>
        </div>

        <div class="card">
            <img src="mesleki ingilize soruları_page-0007.jpg" alt="Mesleki İngilizce Sayfa 7">
            <div class="card-footer">Sayfa 7</div>
        </div>
    </div>

</body>
</html>
